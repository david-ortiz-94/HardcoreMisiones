# RC8-H: lotes ON por defecto para nuevos encuentros; solo WON real + ledger W42.
# /hm jefes lotes recargar (admin). No sustituye premios-jefes.yml (bendiciones).
formato: 1
lotes:
  habilitados: true
  penitencias-habilitadas: true
  eleccion-minutos: 60  # Después, opción Supervivencia automáticamente para no bloquear recibos
  segundo-mision: [50, 75, 85, 95, 100]
  tercero-mision: [10, 25, 40, 55, 75]
  botin-penitencia: [5, 10, 15, 20, 25]
  segundo-penitencia: [0, 0, 0, 5, 10]
  # ID real de la API -> nivel I(1)..V(5), aprobado por creadora.
  # SIN PERFIL NO HAY BOTIN PENITENCIARIO, evita inventar dificultad.
  niveles-penitencia: {}
  # Optional, frozen in each new encounter. Old administrative files without this section
  # use 2.1 defaults for NEW encounters only; old frozen intent journals stay legacy.
  economia-f3:
    version: 3
    I: {rareza: [40, 45, 15, 0], xp: 50, prestigio: 1}
    II: {rareza: [20, 45, 30, 5], xp: 70, prestigio: 1}
    III: {rareza: [10, 35, 40, 15], xp: 90, prestigio: 2}
    IV: {rareza: [5, 25, 45, 25], xp: 120, prestigio: 2}
    V: {rareza: [0, 15, 45, 40], xp: 155, prestigio: 3}
